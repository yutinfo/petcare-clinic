name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgresql://app_user:app_user_dev@localhost:5432/petcare?schema=public
  MIGRATE_DATABASE_URL: postgresql://app_migrator:app_migrator_dev@localhost:5432/petcare?schema=public
  AUTH_SECRET: ci-only-not-a-real-secret-value-32ch
  AUTH_URL: http://localhost:3000
  DEV_TENANT_SLUG: demo

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Integration tests (Postgres จริงผ่าน testcontainers + ตรวจ RLS coverage)
        run: npm run test:int

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app_migrator
          POSTGRES_PASSWORD: app_migrator_dev
          POSTGRES_DB: petcare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_migrator -d petcare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create app_user role
        env:
          PGPASSWORD: app_migrator_dev
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql -h localhost -U app_migrator -d petcare -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'app_user') THEN CREATE ROLE app_user LOGIN PASSWORD 'app_user_dev'; END IF; END \$\$;"
          psql -h localhost -U app_migrator -d petcare -c "GRANT CONNECT ON DATABASE petcare TO app_user;"
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
